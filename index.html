
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b1538">
  <title>MDS RETAILING - Division 1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #67102c, #a51e49);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 28px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      color: #8b1538;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 8px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline-color: #8b1538;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #8b1538;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #b00020;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 25px;
    }
    .menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.menu-card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer;
}

.menu-card span {
  font-size: 30px;
}

.menu-card h3 {
  margin-bottom: 8px;
  color: #222;
}

.menu-card p {
  color: #777;
  font-size: 14px;
}
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">MDS RETAILING</div>
    <div class="subtitle">DIVISION 1 MANAGEMENT APP</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Masukkan username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">LOGIN</button>
      <div id="message"></div>
    </form>

    <div class="footer">
      MDS RETAILING © 2026
    </div>
  </div>
<!-- DASHBOARD -->
<div id="dashboard" style="display:none; width:100%; min-height:100vh; background:#f5f5f5; padding:20px;">
    <h2> MDS RETAILING </h2>
    <h3>DIVISION 1 MANAGEMENT</h3>
    <p>Selamat datang di Dashboard!</p>
</div>
 <script>

const API_URL = "https://script.google.com/macros/s/AKfycbw5z_xDVn_QwNtwQhul8kEvhZYaK54-qijn863jZ5g66i27YdkNlglLpAU6JFzEkupx/exec";

document.getElementById("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  const button = document.getElementById("loginButton");

  button.disabled = true;
  message.style.color = "#555";
  message.textContent = "Sedang memeriksa login...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "login",
        username: username,
        password: password
      })
    });

    const result = await response.json();

    if (result.success) {
  // Simpan token login
  sessionStorage.setItem("mds_token", result.token);

  // Sembunyikan halaman login
  document.querySelector(".login-card").style.display = "none";

  // Tampilkan dashboard
  const dashboard = document.getElementById("dashboard");
  dashboard.style.display = "block";

  // Tampilkan informasi pengguna
  
const role = (result.user.role || "").toLowerCase();

const supervisorMenu = `
  <div class="menu-grid">
    <div class="menu-card">
      <span>📊</span>
      <h3>Sales Performance</h3>
      <p>Monitoring penjualan divisi</p>
    </div>

    <div class="menu-card">
      <span>🎯</span>
      <h3>Sales Target</h3>
      <p>Target dan pencapaian penjualan</p>
    </div>

    <div class="menu-card">
      <span>📦</span>
      <h3>Product Tracking</h3>
      <p>Monitoring produk dan artikel</p>
    </div>

    <div class="menu-card">
      <span>👥</span>
      <h3>Team Management</h3>
      <p>Data tim dan pembagian brand</p>
    </div>

    <div class="menu-card">
      <span>📋</span>
      <h3>Daily Monitoring</h3>
      <p>Monitoring aktivitas harian</p>
    </div>
  </div>
`;

const staffMenu = `
  <div class="menu-grid">
    <div class="menu-card">
      <span>📦</span>
      <h3>Product Tracking</h3>
      <p>Monitoring produk brand</p>
    </div>

    <div class="menu-card">
      <span>💰</span>
      <h3>Daily Sales</h3>
      <p>Input dan monitoring penjualan</p>
    </div>

    <div class="menu-card">
      <span>📝</span>
      <h3>Product Update</h3>
      <p>Update informasi produk</p>
    </div>
  </div>
`;


function showDashboard() {
  dashboard.innerHTML = `
    <div style="max-width:1100px; margin:auto;">
      <h2>MDS RETAILING</h2>
      <h3>DIVISION 1 MANAGEMENT</h3>
      <hr>

      <h3>Selamat Datang, ${result.user.nama || username}!</h3>
      <p>Role: ${result.user.role}</p>
      <p>World: ${result.user.world}</p>

      <h3 style="margin-top:30px;">MENU UTAMA</h3>

      ${role === "supervisor" ? supervisorMenu : staffMenu}
    </div>
  `;

  // Mengaktifkan klik pada menu
  dashboard.querySelectorAll(".menu-card").forEach(card => {
    card.addEventListener("click", function() {
      const menuName = card.querySelector("h3").textContent.trim();

      if (menuName === "Product Tracking") {
        showProductTracking();
      } else {
        alert("Menu " + menuName + " akan segera tersedia.");
      }
    });
  });
}

// Halaman Product Tracking
function showProductTracking() {
  dashboard.innerHTML = `
    <div style="max-width:1100px; margin:auto;">

      <button id="backDashboard"
        style="background:#8b1538; color:white; border:none;
        padding:12px 20px; border-radius:8px; cursor:pointer;">
        ← Kembali ke Dashboard
      </button>

      <h2 style="margin-top:25px;">PRODUCT TRACKING</h2>
      <h3>MDS RETAILING - DIVISION 1</h3>
      <hr>

      <p>Monitoring kondisi dan performa produk setiap brand.</p>
<div id="trackingBrandArea">
  <p>Memuat daftar brand...</p>
</div>
      <div class="menu-grid">

        <div class="menu-card">
          <span>🏆</span>
          <h3>Best Seller</h3>
          <p>Monitoring produk dengan penjualan tertinggi.</p>
        </div>

        <div class="menu-card">
          <span>🆕</span>
          <h3>New Arrival</h3>
          <p>Monitoring produk baru yang masuk ke toko.</p>
        </div>

        <div class="menu-card">
          <span>📏</span>
          <h3>Missing Size</h3>
          <p>Monitoring ukuran produk yang kosong.</p>
        </div>

        <div class="menu-card">
          <span>📦</span>
          <h3>Dead Stock</h3>
          <p>Monitoring produk dengan pergerakan penjualan rendah.</p>
        </div>

      </div>

    </div>
  `;

  document.getElementById("backDashboard").addEventListener("click", showDashboard);
  loadTrackingBrands();
}

// Tampilkan Dashboard pertama kali
showDashboard();



  console.log("Data pengguna:", result.user);
} else {
      message.style.color = "#b00020";
      message.textContent = result.message || "Login gagal.";
    }
  } catch (error) {
    message.style.color = "#b00020";
    message.textContent = "Koneksi gagal: " + error.message;
  } finally {
    button.disabled = false;
  }
});

async function loadTrackingBrands() {
  const token = sessionStorage.getItem("mds_token");
  const area = document.getElementById("trackingBrandArea");

  if (!area) return;

  area.innerHTML = "<p>Memuat daftar brand...</p>";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "getTrackingBrands",
        token: token
      })
    });

    const result = await response.json();

    if (!result.success) {
      area.innerHTML = `<p>${result.message || "Gagal memuat brand."}</p>`;
      return;
    }

    if (!result.brands || result.brands.length === 0) {
      area.innerHTML = "<p>Belum ada brand yang ditugaskan.</p>";
      return;
    }

    area.innerHTML = `
      <h3>DAFTAR BRAND</h3>
      <div class="menu-grid">
        ${result.brands.map(brand => `
          <div class="menu-card">
            <h3>${brand.brandName}</h3>
            <p>World: ${brand.world}</p>
          </div>
        `).join("")}
      </div>
    `;

  } catch (error) {
    area.innerHTML = `<p>Gagal menghubungi server: ${error.message}</p>`;
  }
}

</script>
</body>
</html>
