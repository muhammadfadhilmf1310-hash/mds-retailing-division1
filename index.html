async function loadTrackingBrands() {
  const token = sessionStorage.getItem("mds_token");
  const area = document.getElementById("trackingBrandArea");

  if (!area) return;

  area.innerHTML = "<p>Memuat daftar brand...</p>";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "getTrackingBrands",
        token: token
      })
    });

    const result = await response.json();

    if (!result.success) {
      area.innerHTML = `<p>${result.message || "Gagal memuat brand."}</p>`;
      return;
    }

    if (!result.brands || result.brands.length === 0) {
      area.innerHTML = "<p>Belum ada brand yang ditugaskan.</p>";
      return;
    }

    area.innerHTML = `
      <h3>DAFTAR BRAND</h3>
      <div class="menu-grid">
        ${result.brands.map((brand, index) => `
          <div class="menu-card"
            data-brand-index="${index}"
            style="cursor:pointer;">
            <h3>${brand.brandName}</h3>
            <p>World: ${brand.world}</p>
            <small>Klik untuk membuka tracking →</small>
          </div>
        `).join("")}
      </div>
    `;

    area.querySelectorAll(".menu-card").forEach(card => {
      card.addEventListener("click", function() {
        const index = Number(this.dataset.brandIndex);
        const selectedBrand = result.brands[index];

        showBrandTracking(selectedBrand);
      });
    });

  } catch (error) {
    area.innerHTML = `<p>Gagal menghubungi server: ${error.message}</p>`;
  }
}

function showTrackingForm(trackingType, brand) {
  const dashboard = document.getElementById("dashboard");

  const letterSizes = [

    "XXXL", "XXXXL", "XXXXXL", "XXXXXXL"
  ];

  const numberSizes = Array.from(
    { length: 13 },
    (_, i) => String(i + 28)
  );

  const sizeOptions = [...letterSizes, ...numberSizes];

  dashboard.innerHTML = `
    <div style="max-width:700px; margin:auto; padding:20px;">

      <button type="button" id="backToBrand"
        style="background:#8b1538;color:white;border:none;

      <h3>${brand.brandName}</h3>
      <p>World: ${brand.world}</p>
      <hr>

      <label>Nama Produk</label>
      <input id="productName" type="text"
        placeholder="Masukkan nama produk"
        style="width:100%;padding:12px;margin:8px 0 16px;">

      <label>Article Code</label>
      <input id="articleCode" type="text"
        placeholder="Masukkan kode artikel"
        style="width:100%;padding:12px;margin:8px 0 16px;">

      <label>Size</label>
      <select id="productSize"
        style="width:100%;padding:12px;margin:8px 0 16px;">
        <option value="">Pilih Size</option>
        <optgroup label="Ukuran Huruf">
          ${letterSizes.map(size =>
            `<option value="${size}">${size}</option>`
          ).join("")}
        </optgroup>
        <optgroup label="Ukuran Angka">
          ${numberSizes.map(size =>
            `<option value="${size}">${size}</option>`
          ).join("")}
        </optgroup>
      </select>

      <label>Sisa Stock</label>
      <input id="currentStock" type="number" min="0"
        placeholder="Masukkan sisa stock"
        style="width:100%;padding:12px;margin:8px 0 16px;">

      <label>Stock Terjual</label>
      <input id="soldQty" type="number" min="0"
        placeholder="Masukkan stock terjual"
        style="width:100%;padding:12px;margin:8px 0 16px;">

      <button type="button" id="saveTracking"
        style="background:#8b1538;color:white;border:none;
        padding:12px 20px;border-radius:8px;cursor:pointer;">
        SIMPAN
      </button>

      <p id="trackingMessage"></p>
    </div>
  `;

  document.getElementById("backToBrand").onclick = function() {
    showBrandTracking(brand);
  };

  document.getElementById("saveTracking").onclick = async function() {
    const button = this;
    const message = document.getElementById("trackingMessage");

    const productName =
      document.getElementById("productName").value.trim();

    const articleCode =
      document.getElementById("articleCode").value.trim();

    const size =
      document.getElementById("productSize").value;

    const currentStock =
      document.getElementById("currentStock").value;

    const soldQty =
      document.getElementById("soldQty").value;

    if (
      !productName ||
      !articleCode ||
      !size ||
      currentStock === "" ||
      soldQty === "" ||
      !Number.isInteger(Number(currentStock)) ||
      !Number.isInteger(Number(soldQty)) ||
      Number(currentStock) < 0 ||
      Number(soldQty) < 0
    ) {
      message.style.color = "red";
      message.textContent = "Lengkapi semua data dengan benar.";
      return;
    }

    button.disabled = true;
    message.style.color = "#555";
    message.textContent = "Sedang menyimpan data...";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "saveTracking",
          token: sessionStorage.getItem("mds_token"),
          trackingType: trackingType,
          brandId: brand.brandId,
          productName: productName,
          articleCode: articleCode,
          size: size,
          currentStock: Number(currentStock),
          soldQty: Number(soldQty)
        })
      });

      const result = await response.json();

      if (result.success) {
        message.style.color = "green";
        message.textContent = result.message;

        document.getElementById("productName").value = "";
        document.getElementById("articleCode").value = "";
        document.getElementById("productSize").value = "";
        document.getElementById("currentStock").value = "";
        document.getElementById("soldQty").value = "";
      } else {
        message.style.color = "red";
        message.textContent =
          result.message || "Gagal menyimpan data.";
      }

    } catch (error) {
      message.style.color = "red";
      message.textContent =
        "Gagal menghubungi server: " + error.message;
    } finally {
      button.disabled = false;
    }
  };
}

        )
      );

      const totalStock = filtered.reduce(
        (sum, record) => sum + record.currentStock, 0
      );

      const totalSold = filtered.reduce(
        (sum, record) => sum + record.soldQty, 0
      );

      document.getElementById("totalArticles").textContent =
        articleKeys.size.toLocaleString("id-ID");

      document.getElementById("totalStock").textContent =
        totalStock.toLocaleString("id-ID");

      document.getElementById("totalSold").textContent =
        totalSold.toLocaleString("id-ID");

      const bestSeller = [...filtered]
        .sort((a, b) => b.soldQty - a.soldQty)
        .slice(0, 10);

      document.getElementById("topSeller").innerHTML =
        bestSeller.length
          ? `<div class="analytics-scroll">
              <table class="analytics-table">
                <tr>
                  <th>Produk</th><th>Brand</th>
                  <th>Size</th><th>Terjual</th>
                </tr>
                ${bestSeller.map(record => `
                  <tr>
                    <td>${escapeAnalytics(record.productName)}</td>
                    <td>${escapeAnalytics(record.brandName)}</td>
                    <td>${escapeAnalytics(record.size)}</td>
                    <td>${record.soldQty}</td>
                  </tr>
                `).join("")}
              </table>
            </div>`
          : "<p>Belum ada data.</p>";

      const lowStock = filtered
        .filter(record => record.currentStock <= 3)
        .sort((a, b) => a.currentStock - b.currentStock);

      document.getElementById("lowStock").innerHTML =
        lowStock.length
          ? lowStock.map(record => `
              <div class="analytics-alert">
                <strong>${escapeAnalytics(record.productName)}</strong>
                (${escapeAnalytics(record.size)}) —
                ${escapeAnalytics(record.brandName)}
                <br>Sisa stock: ${record.currentStock}
              </div>
            `).join("")
          : "<p>Tidak ada artikel dengan stok 3 pcs atau kurang.</p>";

      document.getElementById("trackingTable").innerHTML =
        filtered.length
          ? `<div class="analytics-scroll">
              <table class="analytics-table">
                <tr>
                  <th>Produk</th><th>Article</th><th>Size</th>
                  <th>Brand</th><th>Sisa Stock</th><th>Terjual</th>
                </tr>
                ${filtered.map(record => `
                  <tr>
                    <td>${escapeAnalytics(record.productName)}</td>
                    <td>${escapeAnalytics(record.articleCode)}</td>
                    <td>${escapeAnalytics(record.size)}</td>
                    <td>${escapeAnalytics(record.brandName)}</td>
                    <td>${record.currentStock}</td>
                    <td>${record.soldQty}</td>
                  </tr>
                `).join("")}
              </table>
            </div>`
          : "<p>Belum ada data untuk filter ini.</p>";
    }

    worldFilter.onchange = function() {
      brandFilter.value = "All";

      Array.from(brandFilter.options).forEach(option => {
        if (option.value === "All") return;

        const brand = brands.find(item => item.id === option.value);
        option.hidden = worldFilter.value !== "All" &&
          brand.world !== worldFilter.value;
      });

      renderAnalytics();
    };

    brandFilter.onchange = renderAnalytics;
    typeFilter.onchange = renderAnalytics;

    renderAnalytics();

  } catch (error) {
    document.getElementById("analyticsMessage").style.color = "red";
    document.getElementById("analyticsMessage").textContent =
      "Gagal mengambil data: " + error.message;
  }
}

function escapeAnalytics(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}



</script>
</body>
</html>
