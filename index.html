
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b1538">
  <title>MDS RETAILING - Division 1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #67102c, #a51e49);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 28px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      color: #8b1538;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 8px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline-color: #8b1538;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #8b1538;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #b00020;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">MDS RETAILING</div>
    <div class="subtitle">DIVISION 1 MANAGEMENT APP</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Masukkan username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">LOGIN</button>
      <div id="message"></div>
    </form>

    <div class="footer">
      MDS RETAILING © 2026
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Tampilan login sudah siap. Koneksi server akan ditambahkan pada tahap berikutnya.";
    });
  </script>
</body>
</html>
